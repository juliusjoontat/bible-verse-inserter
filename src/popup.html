<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Verse Inserter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #667eea;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
    }
    
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    #copyBtn {
      background: #667eea;
      color: white;
    }
    
    #copyBtn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    #pasteBtn {
      background: #48bb78;
      color: white;
    }
    
    #pasteBtn:hover {
      background: #38a169;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    #verseOutput {
      margin-top: 20px;
      padding: 15px;
      background: #f7fafc;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      max-height: 350px;
      overflow-y: auto;
      display: none;
      line-height: 1.6;
      font-size: 13px;
      color: #333;
    }
    
    #verseOutput.show {
      display: block;
    }
    
    .verse-reference {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .verse-divider {
      height: 1px;
      background: #e0e0e0;
      margin: 8px 0;
    }
    
    .verse-text {
      color: #333;
      line-height: 1.8;
    }
    
    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      display: none;
      animation: slideIn 0.3s ease-out;
    }
    
    #status.show {
      display: block;
    }
    
    #status.success {
      background: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }
    
    #status.error {
      background: #fed7d7;
      color: #742a2a;
      border: 1px solid #fc8181;
    }
    
    #status.loading {
      background: #bee3f8;
      color: #2c5282;
      border: 1px solid #90cdf4;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .settings-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #667eea;
      padding: 5px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    
    .settings-btn:hover {
      background: rgba(102, 126, 234, 0.1);
    }
    
    .container {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 Bible Verse Inserter</h1>
    
    <div class="form-group">
      <label for="bibleVersion">Bible Version:</label>
      <select id="bibleVersion">
        <option value="esv">English Standard Version (ESV)</option>
        <option value="niv">New International Version (NIV)</option>
        <option value="nasb">New American Standard Bible (NASB)</option>
        <option value="kjv">King James Version (KJV)</option>
        <option value="nkjv">New King James Version (NKJV)</option>
        <option value="asv">American Standard Version (ASV)</option>
        <option value="web">World English Bible (WEB)</option>
        <option value="ylt">Young's Literal Translation (YLT)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="verseReference">Verse Reference:</label>
      <input 
        type="text" 
        id="verseReference" 
        placeholder="e.g., John 3:16 or Rom 1:18-23, 3:9, 3:23"
        autocomplete="off"
      >
    </div>
    
    <div class="buttons">
      <button id="copyBtn">📋 Copy</button>
      <button id="pasteBtn">✏️ Paste</button>
    </div>
    
    <div id="status"></div>
    
    <div id="verseOutput">
      <div class="verse-reference" id="verseRef"></div>
      <div class="verse-divider"></div>
      <div class="verse-text" id="verseText"></div>
    </div>
  </div>

  <!-- Polyfill first, then our scripts -->
  <script src="browser-polyfill.js"></script>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
